async function importar() {
    // 1. Limpa dados antigos
    msg('Limpando dados antigos...', 'warn');
    await fetch('/api/limpar', { method: 'POST' });
    msg('Dados antigos excluidos!\n', 'warn');

    // 2. Monta lista para envio
    const lista = dividas.map(d => ({
        tipo: 'despesa', data: d.data, mesAno: d.mes,
        descricao: d.desc, valor: d.valor,
        categoria: 'Dívidas', status: 'pendente'
    }));

    // 3. Envia tudo de uma vez para a API
    msg('Enviando para o banco SQL...', 'info');
    const resp = await fetch('/api/transacoes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(lista)
    });
    const result = await resp.json();

    // 4. Log
    let total = 0;
    dividas.forEach((d, i) => {
        total += d.valor;
        msg(`  [${i+1}/${dividas.length}] ${d.desc} -- R$ ${d.valor.toFixed(2)}`, 'ok');
    });

    msg('\n' + '='.repeat(50), 'info');
    msg(`CONCLUIDO! ${result.total} dividas salvas no banco SQL`, 'ok');
    msg(`Total: R$ ${total.toLocaleString('pt-BR',{minimumFractionDigits:2})}`, 'info');
    msg(`\nAbra: http://localhost:8080/index.html`, 'info');
}

importar().catch(e => msg('ERRO: ' + e.message, 'warn'));
