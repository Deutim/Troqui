{% extends 'base.html' %}
{% block titulo %}{{ 'Editar' if f else 'Nova' }} Despesa Fixa{% endblock %}

{% block conteudo %}
<div class="fc-page">
    <div class="page-header">
        <a href="{{ url_for('fixas') }}" class="btn-voltar">← Voltar</a>
        <h2 class="page-titulo">🔄 {{ 'Editar' if f else 'Nova' }} Despesa Fixa</h2>
    </div>

    <form method="POST" class="fc-form" novalidate>
        <div class="form-group">
            <label class="form-label" for="descricao">📝 Descrição</label>
            <input type="text" id="descricao" name="descricao" class="form-input"
                   placeholder="Ex: Aluguel, Internet..." 
                   value="{{ f.descricao if f else '' }}" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="valor">💵 Valor (R$)</label>
            <input type="number" id="valor" name="valor" class="form-input"
                   placeholder="0,00" min="0.01" step="0.01" 
                   value="{{ f.valor if f else '' }}" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="categoria">🏷️ Categoria</label>
            <select id="categoria" name="categoria" class="form-input form-select" required>
                <option value="">Selecione...</option>
                {% for cat in ['Moradia','Alimentação','Transporte','Saúde','Educação','Lazer','Investimentos','Dívidas'] %}
                <option value="{{ cat }}" {{ 'selected' if f and f.categoria == cat else '' }}>{{ cat }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label class="form-label" for="dia_vencimento">📅 Dia do Vencimento (1 a 31)</label>
            <input type="number" id="dia_vencimento" name="dia_vencimento" class="form-input"
                   placeholder="Ex: 10" min="1" max="31" step="1" 
                   value="{{ f.dia_vencimento if f else '' }}" required>
        </div>

        <button type="submit" class="btn-salvar btn-vermelho">💾 Salvar Despesa Fixa</button>
    </form>

    {% if f %}
    <div style="margin-top:16px;text-align:center">
        <a href="{{ url_for('excluir_fixa', id=f.id) }}" class="btn-salvar btn-vermelho"
           style="display:inline-block;text-decoration:none;max-width:300px; background: transparent; border: 1px solid var(--red-bright); color: var(--red-bright); box-shadow: none;"
           onclick="return confirm('Tem certeza que deseja excluir esta despesa fixa?')">
            🗑️ Excluir Fixa
        </a>
    </div>
    {% endif %}
</div>
{% endblock %}
